<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAINI WORK</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#13213c
}
.top{
 background:linear-gradient(135deg,#071b3a,#0b65d8);
 color:#fff;
 padding:16px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center
}
.brand{font-size:24px;font-weight:900}
.wrap{max-width:1100px;margin:auto;padding:22px 15px}
.box{
 max-width:450px;
 margin:35px auto;
 background:#fff;
 padding:27px;
 border-radius:20px;
 box-shadow:0 10px 35px #0001
}
.hidden{display:none}
label{display:block;margin-top:10px}
input{
 width:100%;
 padding:12px;
 border:1px solid #d9e0e8;
 border-radius:10px;
 margin:6px 0 12px;
 font-size:16px
}
.btn{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 background:#0b65d8;
 color:#fff;
 font-weight:700;
 cursor:pointer
}
.btn.alt{
 background:#edf4ff;
 color:#0b65d8
}
.switch{
 text-align:center;
 margin-top:15px;
 color:#0b65d8;
 cursor:pointer
}
.error{color:#c62828;font-size:13px}
.ok{color:#08783f;font-size:13px}
.notice{
 background:#fff8df;
 border-left:4px solid #e1aa00;
 padding:12px;
 border-radius:8px;
 font-size:13px
}
.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px
}
.card{
 background:#fff;
 padding:18px;
 border-radius:16px;
 margin-bottom:15px;
 box-shadow:0 6px 25px #0000000b
}
.value{
 font-size:26px;
 font-weight:900;
 margin-top:6px
}
.green{color:#079455}
.blue{color:#0b65d8}
.gold{color:#b37b00}
.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px
}
.portal{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px 0;
 border-bottom:1px solid #eee
}
.portal-name{font-weight:700}
.portal-buttons{
 display:flex;
 gap:6px
}
.portal-admin{
 padding:18px 0;
 border-bottom:1px solid #eee
}
.portal-admin:last-child{border-bottom:0}
table{
 width:100%;
 border-collapse:collapse
}
th,td{
 padding:10px;
 border-bottom:1px solid #eee;
 text-align:left;
 font-size:13px
}
th{background:#f0f5fb}

@media(max-width:800px){
 .cards{grid-template-columns:repeat(2,1fr)}
 .grid2{grid-template-columns:1fr}
}
@media(max-width:520px){
 .cards{grid-template-columns:1fr}
 .brand{font-size:20px}
 .portal{flex-direction:column;align-items:flex-start;gap:8px}
 .portal-buttons{width:100%}
 .portal-buttons .btn{flex:1;text-align:center}
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->
<div id="auth" class="box">

  <!-- LOGIN -->
  <div id="loginForm">

    <div class="brand">SHAINI WORK</div>
    <p>Member / Admin Login</p>

    <label>Username</label>
    <input
      id="lu"
      autocomplete="username"
      placeholder="Username"
    >

    <label>Password</label>
    <input
      id="lp"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >

    <button
      class="btn"
      style="width:100%"
      onclick="login()"
    >
      Login
    </button>

    <p id="le" class="error"></p>

    <div
      class="switch"
      onclick="showReg()"
    >
      New Worker? Create Account
    </div>

  </div>


  <!-- REGISTER -->
  <div id="regForm" class="hidden">

    <div class="brand">Create SHAINI WORK Account</div>

    <p>
      अपना mobile number देकर अपना Login ID और Password बनाएं।
    </p>

    <label>Full Name</label>
    <input
      id="rn"
      placeholder="आपका नाम"
    >

    <label>Mobile Number</label>
    <input
      id="rp"
      inputmode="numeric"
      maxlength="10"
      placeholder="10 digit mobile number"
    >

    <label>Create Login ID</label>
    <input
      id="ru"
      placeholder="अपना username बनाएं"
    >

    <label>Create Password</label>
    <input
      id="rpass"
      type="password"
      placeholder="कम से कम 6 characters"
    >

    <label>Confirm Password</label>
    <input
      id="rc"
      type="password"
      placeholder="Password फिर से डालें"
    >

    <button
      class="btn"
      style="width:100%"
      onclick="register()"
    >
      Create Account
    </button>

    <p id="re"></p>

    <div
      class="switch"
      onclick="showLogin()"
    >
      Already have an account? Login
    </div>

  </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

  <header class="top">

    <div>
      <div class="brand">SHAINI WORK</div>
      <small>Work Management Dashboard</small>
    </div>

    <button
      class="btn alt"
      onclick="logout()"
    >
      Logout
    </button>

  </header>

  <main
    class="wrap"
    id="content"
  ></main>

</div>


<script>

const $=id=>document.getElementById(id);


/* ================= API ================= */

async function api(url,opt={}){

  opt.headers={
    ...(opt.headers||{}),
    "Content-Type":"application/json"
  };

  let t=localStorage.getItem("sw_token");

  if(t){
    opt.headers.Authorization="Bearer "+t;
  }

  let r=await fetch(url,opt);

  let d=await r.json().catch(()=>({}));

  if(!r.ok){
    throw Error(d.error||"Request failed");
  }

  return d;
}


/* ================= LOGIN / REGISTER ================= */

function showReg(){

  $("loginForm").classList.add("hidden");
  $("regForm").classList.remove("hidden");

}


function showLogin(){

  $("regForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");

}


async function register(){

  let n=$("rn").value.trim();
  let p=$("rp").value.trim();
  let u=$("ru").value.trim();
  let pw=$("rpass").value;
  let c=$("rc").value;

  if(!n||!p||!u||!pw){

    $("re").className="error";
    $("re").textContent="सभी जानकारी भरें";
    return;

  }

  if(pw!==c){

    $("re").className="error";
    $("re").textContent="Password match नहीं कर रहा";
    return;

  }

  try{

    await api("/api/register",{
      method:"POST",
      body:JSON.stringify({
        name:n,
        phone:p,
        username:u,
        password:pw
      })
    });

    $("re").className="ok";
    $("re").textContent="Account बन गया! अब Login करें.";

    setTimeout(showLogin,900);

  }catch(e){

    $("re").className="error";
    $("re").textContent=e.message;

  }

}


async function login(){

  try{

    let d=await api("/api/login",{
      method:"POST",
      body:JSON.stringify({
        username:$("lu").value.trim(),
        password:$("lp").value
      })
    });

    localStorage.setItem("sw_token",d.token);

    load();

  }catch(e){

    $("le").textContent=e.message;

  }

}


function logout(){

  localStorage.removeItem("sw_token");

  location.reload();

}


function money(n){

  return "₹"+Number(n||0).toLocaleString("en-IN");

}


/* ================= LOAD ================= */

async function load(){

  try{

    let d=await api("/api/me");

    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");

    if(d.user.role==="admin"){

      admin();

    }else{

      member(d);

    }

  }catch{

    logout();

  }

}


/* ================= WORKER DASHBOARD ================= */

function member(d){

  let u=d.user;

  $("content").innerHTML=`

    <div class="card">

      <h1>नमस्ते, ${u.name} 👋</h1>

      <p>
        Mobile: ${u.phone}
        • Member ID: ${u.id}
      </p>

      <div class="notice">
        आपका account successfully login हो गया है।
        यहाँ आपकी earning और work details दिखाई देंगी।
      </div>

    </div>


    <div class="cards">

      <div class="card">
        Total Earning
        <div class="value green">
          ${money(u.earning)}
        </div>
      </div>

      <div class="card">
        Portals
        <div class="value blue">
          ${d.portals.length}
        </div>
      </div>

      <div class="card">
        Customers
        <div class="value gold">
          ${u.customers}
        </div>
      </div>

      <div class="card">
        Pending
        <div class="value">
          ${money(u.pending)}
        </div>
      </div>

    </div>


    <div class="grid2">

      <div class="card">

        <h2>🔗 Portals</h2>

        ${
          d.portals.map(p=>`

            <div class="portal">

              <div class="portal-name">
                ${p.name}
              </div>

              <div class="portal-buttons">

                <a
                  class="btn alt"
                  href="${p.url}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="text-decoration:none"
                >
                  Open
                </a>

              </div>

            </div>

          `).join("")
          ||
          "<p>No portals available</p>"
        }

      </div>


      <div class="card">

        <h2>💰 Payment</h2>

        <p>
          Total:
          <b>${money(u.earning)}</b>
        </p>

        <p>
          Paid:
          <b class="green">
            ${money(u.paid)}
          </b>
        </p>

        <p>
          Pending:
          <b>
            ${money(u.pending)}
          </b>
        </p>

      </div>

    </div>


    <div class="card">

      <h2>📊 Activity</h2>

      <table>

        <tr>
          <th>Date</th>
          <th>Work</th>
          <th>Status</th>
          <th>Amount</th>
        </tr>

        ${
          d.activities.map(a=>`

            <tr>

              <td>
                ${new Date(a.created_at).toLocaleString("en-IN")}
              </td>

              <td>
                ${a.activity}
              </td>

              <td>
                ${a.status}
              </td>

              <td>
                ${money(a.amount)}
              </td>

            </tr>

          `).join("")
          ||
          "<tr><td colspan=4>No activity yet</td></tr>"
        }

      </table>

    </div>

  `;

}


/* ================= ADMIN DASHBOARD ================= */

async function admin(){

  try{

    let us=await api("/api/admin/users");

    let portals=await api("/api/admin/portals");


    $("content").innerHTML=`

      <div class="card">

        <h1>⚙️ Admin Dashboard</h1>

        <p>
          यहाँ से registered workers और portal links
          manage किए जा सकते हैं।
        </p>

      </div>


      <div class="cards">

        <div class="card">

          Members

          <div class="value">
            ${us.length}
          </div>

        </div>


        <div class="card">

          Total Earning

          <div class="value green">
            ${money(
              us.reduce((s,u)=>s+u.earning,0)
            )}
          </div>

        </div>


        <div class="card">

          Pending

          <div class="value">
            ${money(
              us.reduce((s,u)=>s+u.pending,0)
            )}
          </div>

        </div>


        <div class="card">

          Active

          <div class="value blue">
            ${
              us.filter(
                u=>u.status==="active"
              ).length
            }
          </div>

        </div>

      </div>


      <!-- PORTAL MANAGEMENT -->

      <div class="card">

        <h2>🔗 Portal Management</h2>

        <p>
          यहाँ जो link डालेंगे,
          वही link Worker Dashboard में दिखाई देगा।
        </p>


        <div>

          ${
            portals.map(p=>`

              <div class="portal-admin">

                <label>
                  <b>Portal ${p.id}</b>
                </label>


                <input
                  id="portalName${p.id}"
                  value="${escapeHtml(p.name)}"
                  placeholder="Portal Name"
                >


                <input
                  id="portalUrl${p.id}"
                  value="${escapeHtml(p.url)}"
                  placeholder="https://example.com/register"
                  type="url"
                >


                <button
                  class="btn"
                  onclick="savePortal(${p.id})"
                >
                  💾 Save Portal ${p.id}
                </button>


                <a
                  id="testPortal${p.id}"
                  class="btn alt"
                  href="${p.url}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="display:inline-block;text-decoration:none;margin-left:5px"
                >
                  🔗 Test Open
                </a>


                <p
                  id="portalMsg${p.id}"
                ></p>

              </div>

            `).join("")
          }

        </div>

      </div>


      <!-- WORKERS -->

      <div class="card">

        <h2>👥 Registered Workers</h2>

        <div style="overflow-x:auto">

          <table>

            <tr>
              <th>Name</th>
              <th>Mobile</th>
              <th>Username</th>
              <th>Portal</th>
              <th>Customer</th>
              <th>Earning</th>
              <th>Status</th>
            </tr>

            ${
              us.map(u=>`

                <tr>

                  <td>${u.name}</td>

                  <td>${u.phone}</td>

                  <td>${u.username}</td>

                  <td>${u.portals}</td>

                  <td>${u.customers}</td>

                  <td>${money(u.earning)}</td>

                  <td>${u.status}</td>

                </tr>

              `).join("")
              ||
              "<tr><td colspan=7>No workers</td></tr>"
            }

          </table>

        </div>

      </div>

    `;

  }catch(e){

    $("content").innerHTML=`

      <div class="card">

        <h2>❌ Admin Dashboard Error</h2>

        <p>${e.message}</p>

      </div>

    `;

  }

}


/* ================= SAVE PORTAL ================= */

async function savePortal(id){

  const name=$("portalName"+id).value.trim();

  const url=$("portalUrl"+id).value.trim();

  const msg=$("portalMsg"+id);


  if(!url){

    msg.className="error";

    msg.textContent="❌ Portal link डालें";

    return;

  }


  if(!/^https?:\/\/.+/i.test(url)){

    msg.className="error";

    msg.textContent=
      "❌ सही link डालें। Link https:// से शुरू होना चाहिए।";

    return;

  }


  msg.className="";

  msg.textContent="Saving...";


  try{

    await api(
      "/api/admin/portals/"+id,
      {
        method:"PATCH",
        body:JSON.stringify({
          name:name,
          url:url
        })
      }
    );


    msg.className="ok";

    msg.textContent=
      "✅ Portal link successfully saved";


    /* Test Open link भी तुरंत update होगा */

    const testLink=$("testPortal"+id);

    if(testLink){

      testLink.href=url;

    }


  }catch(e){

    msg.className="error";

    msg.textContent="❌ "+e.message;

  }

}


/* ================= HTML SECURITY ================= */

function escapeHtml(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================= AUTO LOGIN ================= */

if(localStorage.getItem("sw_token")){

  load();

}

</script>

</body>
</html>
